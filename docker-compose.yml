version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tenant_postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: SuperSecretPassword123
      POSTGRES_DB: multi_tenant_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tenant_redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: